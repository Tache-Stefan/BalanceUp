name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint, Format, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: balanceup
          POSTGRES_PASSWORD: balanceup
          POSTGRES_DB: BalanceUp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U balanceup -d BalanceUp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://balanceup:balanceup@localhost:5432/BalanceUp
      JWT_SECRET_KEY: ci-test-secret
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install Python dependencies
        run: uv sync

      - name: Check formatting (Black)
        run: uv run black --check .

      - name: Lint (Flake8)
        run: uv run flake8 .

      - name: Run tests (Pytest)
        run: uv run pytest

  frontend:
    name: Frontend (Format, Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
